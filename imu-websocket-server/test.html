<script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    /*
     * If the browser and Node.js server are on the SAME machine:
     *
     * ws://127.0.0.1:3000/ws
     *
     * If the browser is on another computer:
     *
     * ws://YOUR_SERVER_IP:3000/ws
     */

    const WS_URL = "ws://127.0.0.1:3000/ws";


    // ============================================================
    // VARIABLES
    // ============================================================

    let socket;

    let frameCount = 0;

    let lastSecondFrames = 0;

    let fps = 0;


    // ============================================================
    // HTML ELEMENTS
    // ============================================================

    const statusElement =
        document.getElementById("status");

    const connectionElement =
        document.getElementById("connection");

    const frameCountElement =
        document.getElementById("frameCount");

    const fpsElement =
        document.getElementById("fps");

    const frameTimeElement =
        document.getElementById("frameTime");

    const sensorCountElement =
        document.getElementById("sensorCount");

    const sensorTable =
        document.getElementById("sensorTable");

    const jsonOutput =
        document.getElementById("jsonOutput");


    // ============================================================
    // CONNECT WEBSOCKET
    // ============================================================

    function connectWebSocket() {

        console.log(
            "Connecting to:",
            WS_URL
        );

        socket = new WebSocket(WS_URL);


        // --------------------------------------------------------
        // CONNECTED
        // --------------------------------------------------------

        socket.onopen = function () {

            console.log(
                "WebSocket connected"
            );

            statusElement.textContent =
                "CONNECTED";

            statusElement.className =
                "status connected";

            connectionElement.textContent =
                "Connected";

            connectionElement.className =
                "value ok";
        };


        // --------------------------------------------------------
        // MESSAGE
        // --------------------------------------------------------

        socket.onmessage = function (event) {

            try {

                const message =
                    JSON.parse(event.data);

                console.log(
                    "Received:",
                    message
                );


                // ------------------------------------------------
                // CONNECTION MESSAGE
                // ------------------------------------------------

                if (message.type === "connection") {

                    console.log(
                        message.message
                    );

                    return;
                }


                // ------------------------------------------------
                // FRAME MESSAGE
                // ------------------------------------------------

                if (message.type !== "frame") {

                    return;
                }


                const frame =
                    message.data;


                // Increase frame count

                frameCount++;

                lastSecondFrames++;

                frameCountElement.textContent =
                    frameCount;


                // Frame timestamp

                frameTimeElement.textContent =
                    frame.time;


                // Sensors

                const sensors =
                    frame.sensors || {};

                const sensorNames =
                    Object.keys(sensors);

                sensorCountElement.textContent =
                    sensorNames.length;


                // Update sensor table

                updateSensorTable(
                    sensors
                );


                // Show JSON

                jsonOutput.textContent =
                    JSON.stringify(
                        frame,
                        null,
                        4
                    );

            }

            catch (error) {

                console.error(
                    "Invalid WebSocket message:",
                    error
                );

            }

        };


        // --------------------------------------------------------
        // CLOSED
        // --------------------------------------------------------

        socket.onclose = function () {

            console.log(
                "WebSocket disconnected"
            );

            statusElement.textContent =
                "DISCONNECTED";

            statusElement.className =
                "status disconnected";

            connectionElement.textContent =
                "Disconnected";

            connectionElement.className =
                "value bad";


            /*
             * Try reconnecting after 2 seconds.
             */

            setTimeout(
                connectWebSocket,
                2000
            );
        };


        // --------------------------------------------------------
        // ERROR
        // --------------------------------------------------------

        socket.onerror = function (error) {

            console.error(
                "WebSocket error:",
                error
            );

        };

    }


    // ============================================================
    // UPDATE SENSOR TABLE
    // ============================================================

    function updateSensorTable(sensors) {

        sensorTable.innerHTML = "";


        for (const sensorName of Object.keys(sensors)) {

            const sensor =
                sensors[sensorName];


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    <strong>
                        ${sensorName}
                    </strong>
                </td>

                <td>${formatValue(sensor.ax)}</td>
                <td>${formatValue(sensor.ay)}</td>
                <td>${formatValue(sensor.az)}</td>

                <td>${formatValue(sensor.gx)}</td>
                <td>${formatValue(sensor.gy)}</td>
                <td>${formatValue(sensor.gz)}</td>

                <td>${formatValue(sensor.qw)}</td>
                <td>${formatValue(sensor.qx)}</td>
                <td>${formatValue(sensor.qy)}</td>
                <td>${formatValue(sensor.qz)}</td>

            `;


            sensorTable.appendChild(row);
        }

    }


    // ============================================================
    // FORMAT NUMBER
    // ============================================================

    function formatValue(value) {

        if (value === null ||
            value === undefined) {

            return "-";
        }


        if (typeof value === "number") {

            return value.toFixed(4);
        }


        return value;
    }


    // ============================================================
    // FPS COUNTER
    // ============================================================

    setInterval(function () {

        fps = lastSecondFrames;

        lastSecondFrames = 0;

        fpsElement.textContent =
            fps + " FPS";

    }, 1000);


    // ============================================================
    // START
    // ============================================================

    connectWebSocket();

</script>
